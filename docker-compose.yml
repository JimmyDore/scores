# Stack scores.jimmydore.fr — un seul service Node.
# Pas de ports publiés : le trafic arrive via le Caddy partagé (stack ravetycoon)
# qui fait le TLS et reverse-proxy vers scores-web:3000 sur le réseau Docker
# `ravetycoon_default`.
#
# ATTENTION : le service est préfixé `scores-` à dessein. Le réseau est partagé
# avec la stack ravetycoon, qui expose déjà les alias DNS `web` et `api` ; un
# service nommé `web` ou `api` ici capterait le trafic de l'autre stack.
#
# `.env` (non versionné, mode 600) est écrit par la CI avec les secrets de l'app.
# Les données vivent sur l'hôte dans /root/scores-data, qui doit appartenir à
# l'uid 1000 (utilisateur `node` du conteneur).
services:
  scores-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: scores-web
    container_name: scores-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      DATA_DIR: /data
      TZ: Europe/Paris
      # SSR (SvelteKit adapter-node) : sans ORIGIN, les form actions échouent au
      # contrôle CSRF. Caddy remplace X-Forwarded-For par l'IP du client : une
      # seule entrée à lire, la plus à droite.
      ORIGIN: https://scores.jimmydore.fr
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
    volumes:
      - /root/scores-data:/data
    networks:
      - ravetycoon_default

networks:
  ravetycoon_default:
    external: true
